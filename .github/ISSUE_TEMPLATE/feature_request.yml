name: Idea or feature request
description: Suggest something new for Copero99
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Copero99 to do, and why would it make careers more fun?
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which mode is it for?
      multiple: true
      options: [Boost, Sandbox, Vanilla, Living world, Hall of Fame, Everywhere]
